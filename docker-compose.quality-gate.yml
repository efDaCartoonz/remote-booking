services:
  postgres:
    ports: !reset []
  redis:
    ports: !reset []
  backend:
    ports: !reset []
  frontend:
    ports: !reset []

  quality-backend:
    build:
      context: ./backend
    working_dir: /app
    env_file:
      - .env.example
    environment:
      PYTHONPATH: /app
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_ADDOPTS: -p no:cacheprovider
    volumes:
      - ./backend:/app
    command:
      - sh
      - -ec
      - >-
        pytest tests
        && ruff check --no-cache app tests
        && ruff format --check --no-cache app tests

  quality-frontend:
    build:
      context: ./frontend
      target: build
    working_dir: /app
    volumes:
      - ./frontend:/app
      - quality-frontend-node-modules:/app/node_modules
      - quality-frontend-dist:/app/dist
    command:
      - sh
      - -ec
      - npm ci && npm run test && npm run build

volumes:
  quality-frontend-node-modules:
  quality-frontend-dist:
